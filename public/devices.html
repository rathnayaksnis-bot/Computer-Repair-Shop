<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devices</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div id="app-header"></div>
  <div class="container">
    <h2>💻 Manage Devices</h2>

    <div class="card">
      <h3>Add / Edit Device</h3>
      <form id="deviceForm" class="form-grid">
        <select id="customer_id" required><option value="">Select Customer</option></select>
        <select id="device_type" required>
          <option value="">Device Type</option>
          <option value="laptop">Laptop</option>
          <option value="desktop">Desktop</option>
          <option value="phone">Phone</option>
          <option value="tablet">Tablet</option>
          <option value="printer">Printer</option>
          <option value="other">Other</option>
        </select>
        <input id="brand" placeholder="Brand" required>
        <input id="model" placeholder="Model" required>
        <input id="serial_number" placeholder="Serial Number">
        <input id="purchase_date" type="date">
        <textarea id="notes" placeholder="Notes" rows="2"></textarea>
        <button class="btn" type="submit">Save Device</button>
        <button class="btn warn" type="button" id="resetBtn">Reset</button>
      </form>
      <div id="msg"></div>
    </div>

    <div class="card">
      <table id="devicesTable">
        <thead><tr>
          <th>ID</th><th>Customer</th><th>Type</th><th>Brand</th>
          <th>Model</th><th>Serial</th><th>Actions</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/devices.js"></script>
</body>
</html>
