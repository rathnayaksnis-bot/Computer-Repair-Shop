<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Computer Repair Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div id="app-header"></div>
  <div class="container">
    <h2>📊 Dashboard Overview</h2>

    <div class="stats-grid">
      <div class="stat-card"><h3>Total Customers</h3><div class="value" id="totalCustomers">-</div></div>
      <div class="stat-card"><h3>Total Devices</h3><div class="value" id="totalDevices">-</div></div>
      <div class="stat-card"><h3>Total Jobs</h3><div class="value" id="totalJobs">-</div></div>
      <div class="stat-card"><h3>Active Jobs</h3><div class="value" id="activeJobs">-</div></div>
      <div class="stat-card"><h3>Today's Jobs</h3><div class="value" id="todayJobs">-</div></div>
      <div class="stat-card"><h3>Total Revenue</h3><div class="value" id="totalRevenue">-</div></div>
      <div class="stat-card"><h3>Pending Payments</h3><div class="value" id="pendingPayments">-</div></div>
    </div>

    <div class="card">
      <div class="flex-between mb-2">
        <h3 style="margin:0;">🔧 Service-wise Report</h3>
        <button id="exportBtn" class="btn">⬇️ Export CSV</button>
      </div>
      <table id="reportTable">
        <thead><tr><th>Service</th><th>Jobs</th><th>Revenue</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
