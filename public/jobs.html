<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repair Jobs</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div id="app-header"></div>
  <div class="container">
    <h2>📋 Repair Jobs</h2>

    <div class="card">
      <h3>Create New Job</h3>
      <form id="jobForm" class="form-grid">
        <select id="customer_id" required><option value="">Select Customer</option></select>
        <select id="device_id" required><option value="">Select Device</option></select>
        <select id="service_id" required><option value="">Select Service</option></select>
        <textarea id="problem_description" placeholder="Problem Description" rows="2" required></textarea>
        <select id="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
          <option value="urgent">Urgent</option>
        </select>
        <input id="received_date" type="date" required>
        <input id="target_date" type="date">
        <button class="btn" type="submit">Create Job</button>
      </form>
      <div id="msg"></div>
    </div>

    <div class="card" style="border-left: 5px solid var(--success);">
      <h3>📊 Job Report</h3>
      <div class="form-grid" style="align-items:end;">
        <div><label style="font-size:0.85rem;">From</label><input type="date" id="reportFrom"></div>
        <div><label style="font-size:0.85rem;">To</label><input type="date" id="reportTo"></div>
        <div>
          <label style="font-size:0.85rem;">Status</label>
          <select id="reportStatus">
            <option value="">All</option>
            <option value="received">Received</option>
            <option value="diagnosing">Diagnosing</option>
            <option value="in_progress">In Progress</option>
            <option value="completed">Completed</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div><button class="btn" id="generateReport">Generate</button></div>
        <div><button class="btn success" id="downloadCSV">⬇️ Download CSV</button></div>
      </div>
      <div id="reportSummary" style="display:none; margin-top:16px;">
        <div class="stats-grid">
          <div class="stat-card"><h3>Total Jobs</h3><div class="value" id="rTotal">0</div></div>
          <div class="stat-card"><h3>Completed</h3><div class="value" id="rCompleted">0</div></div>
          <div class="stat-card"><h3>Active</h3><div class="value" id="rActive">0</div></div>
          <div class="stat-card"><h3>Revenue</h3><div class="value" id="rRevenue">Rs. 0</div></div>
        </div>
        <table id="reportTable" style="margin-top:16px;">
          <thead><tr>
            <th>Job No</th><th>Customer</th><th>Service</th><th>Status</th>
            <th>Cost</th><th>Received</th><th>Payment</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="flex-between mb-2">
        <h3 style="margin:0;">All Jobs</h3>
        <select id="statusFilter" style="padding:8px; border-radius:6px;">
          <option value="">All Status</option>
          <option value="received">Received</option>
          <option value="diagnosing">Diagnosing</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <table id="jobsTable">
        <thead><tr>
          <th>Job No</th><th>Customer</th><th>Device</th><th>Service</th>
          <th>Status</th><th>Priority</th><th>Cost</th><th>Received</th><th>Actions</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/jobs.js"></script>
</body>
</html>
